apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "thunderid.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thunderid.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
