apiVersion: v1
kind: Service
metadata:
  name: {{ include "thunderid.fullname" . }}-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thunderid.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "thunderid.selectorLabels" . | nindent 4 }}
  ports:
    - name: servlet-https
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.deployment.container.port }}
      protocol: TCP
