{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thunderid.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className | default "eg" | quote }}
  listeners:
    {{- if .Values.gateway.tls.enabled }}
    # HTTPS listener with TLS termination
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.ingress.hostname | quote }}
      tls:
        mode: {{ .Values.gateway.tls.mode }}
        certificateRefs:
          - name: {{ .Values.gateway.tls.secretName }}
            kind: Secret
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
    # HTTP listener (for redirects or non-TLS traffic)
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.ingress.hostname | quote }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
