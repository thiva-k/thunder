---
# resource_type: credential_configuration
# OpenID4VCI credential the wallet receives. handle = credential_configuration_id
# (and the OAuth scope). Claims are pulled from the subject's user profile by name.
id: eudi-pid
handle: eudi-pid
ouHandle: default
vct: urn:test:custom:1
display:
  name: EUDI Wallet PID
  locale: en-US
claims:
  - name: given_name
    displayName: Given Name
  - name: family_name
    displayName: Family Name
  - name: birthdate
    displayName: Date of Birth

---
# resource_type: presentation_definition
# OpenID4VP query used to verify the issued PID back. handle = the DCQL credential id.
id: eudi-pid
handle: eudi-pid
ouHandle: default
displayName: EUDI Wallet PID
vct: urn:test:custom:1
mandatoryClaims:
  - given_name
  - family_name
optionalClaims:
  - birthdate
